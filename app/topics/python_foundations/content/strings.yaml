learn.diagnostic.title: "0. С чего начинается выполнение?"
learn.diagnostic.body: |
  Python идёт по строкам файла сверху вниз. Строка def создаёт функцию, но её тело выполняется только после вызова.
  Сначала предскажи, что появится на экране. Затем добавь hello() перед последним print и проверь новый порядок.

learn.values.title: "1. Переменные и значения"
learn.values.body: |
  Присваивание сохраняет текущее значение. Когда x меняется позже, прежнее значение y остаётся прежним.
  Проследи две переменные отдельно. Типы int, float, str и bool узнавай по значениям.

learn.io.title: "2. Ввод и вывод"
learn.io.body: |
  print показывает значение, а input получает текст. Для вычислений введённый текст переводят через int() или float().
  При проверке вывода важны порядок строк и пробелы. В задачах с input ввод всегда указан.

learn.conditions.title: "3. Условия и сравнения"
learn.conditions.body: |
  Знак = присваивает, а == сравнивает. Сравнение даёт True или False.
  В цепочке if/elif/else выполняется первая подходящая ветка. Проверяй условия сверху вниз.

learn.loops.title: "4. Циклы"
learn.loops.body: |
  while проверяет условие перед каждой итерацией. Счётчик должен меняться, иначе цикл может не закончиться.
  break выходит из цикла. range(3) даёт 0, 1 и 2. Проследи одну итерацию целиком.

learn.modulo.title: "5. Счётчик и остаток"
learn.modulo.body: |
  Оператор % возвращает остаток. Для номеров атак остатки при делении на 3 идут так: 1, 2, 0, 1, 2, 0.
  Поэтому turns % 3 == 0 узнаёт каждую третью атаку.

learn.functions.title: "6. Функции: вызов и результат"
learn.functions.body: |
  def определяет функцию, вызов запускает её. Аргумент попадает в параметр.
  return передаёт значение обратно. print только показывает значение; без return функция возвращает None.

learn.randomness.title: "7. Модули и случайный выбор"
learn.randomness.body: |
  import random подключает модуль. randint выбирает целое число из диапазона, choice — один элемент списка.
  Точный результат случайного вызова нельзя предсказать, поэтому в заданиях он указан отдельно.

learn.collections.title: "8. Словарь, кортеж и распаковка"
learn.collections.body: |
  Словарь связывает имя оружия с уроном. Кортеж хранит имя и урон вместе.
  При распаковке name получает первый элемент, damage — второй.

learn.classes.title: "9. Класс и первый объект"
learn.classes.body: |
  class описывает устройство объекта. Вызов Cat создаёт отдельный объект; __init__ записывает его начальные атрибуты.
  self — обычное имя параметра для текущего объекта, а не ключевое слово Python.

learn.methods.title: "10. Методы и два объекта"
learn.methods.body: |
  cat1 и cat2 созданы из одного класса, но имеют собственный hp. В cat1.hit(cat2) self — cat1, other — cat2.
  Выполняй метод по строкам и меняй только названный объект.

learn.terminology.title: "11. Какие имена знает Python?"
learn.terminology.body: |
  if, def и class — ключевые слова. print и int — встроенные имена. random.randint — функция модуля.
  Player и hp придумал программист. __init__ — специальное имя метода. self — не ключевое слово.

learn.lab1_init.title: "12. Fighting: начальное состояние"
learn.lab1_init.body: |
  __init__ создаёт состояние одного игрока. Найди имя, HP, урон, защиту, инициативу и оружие.
  Создание p1 и p2 запускает __init__ два раза: состояние каждого своё.

learn.lab2_weapons.title: "13. Fighting: выбор оружия"
learn.lab2_weapons.body: |
  Словарь хранит название и урон. items() даёт пары, choice выбирает одну, а распаковка разделяет её части.
  В игре выбранная пара сохраняется в self.weapon, чтобы не выбирать оружие снова каждый ход.

learn.lab3_attack.title: "14. Fighting: кто кого атакует?"
learn.lab3_attack.body: |
  В p1.attack(p2) self — p1, other — p2. Перед вычислением урона назови атакующего и цель.
  В примере меняется HP цели.

learn.lab4_armor.title: "15. Fighting: защита и HP"
learn.lab4_armor.body: |
  Урон сначала уменьшает защиту. Если она стала отрицательной, остаток уменьшает HP, затем защита становится нулём.
  Для 600 HP, 100 защиты и 180 урона результат — 520 HP и 0 защиты.

learn.lab5_objects.title: "16. Fighting: два независимых игрока"
learn.lab5_objects.body: |
  p1.hp и p2.hp — разные ячейки состояния. Меняй только ту, которую называет выполненная строка.
  Точно так же отдельно хранятся оружие, инициатива и число атак.

learn.lab6_loop.title: "17. Fighting: карта программы и цикл"
learn.lab6_loop.body: |
  Сначала выполняются определения, затем создаются игроки. Главный while повторяет ходы, пока оба живы.
  После выхода из цикла определяется победитель. Отметь, где начинается конкретная игра.

learn.lab7_initiative.title: "18. Fighting: выбор атакующего"
learn.lab7_initiative.body: |
  Сравнение инициативы происходит до вызова attack. Новый бросок внутри уже начавшейся атаки не заменит атакующего.
  Проследи порядок действий.

learn.lab8_refactor.title: "19. Fighting: исправить инициативу"
learn.lab8_refactor.body: |
  Каждый ход сначала бросай инициативу, затем сравнивай и выбирай атаку. При ничьей перебрасывай только инициативу.
  Создание нового Player сбросило бы HP, защиту и оружие.

learn.lab9_critical.title: "20. Финальное задание: критический удар"
learn.lab9_critical.body: |
  Открой свой Fighting. Добавь отдельный счётчик атак каждому игроку. Увеличивай его один раз за атаку.
  Каждая третья атака должна бить прямо по HP и оставлять защиту неизменной.
  Проверь три атаки каждого игрока и объясни, почему при третьей срабатывает % 3 == 0.

learn.d20.title: "21. По желанию: маленькая функция d20"
learn.d20.body: |
  Большая ролевая игра состоит из знакомых маленьких частей. Эта функция соединяет return и randint.
  Дополнительные игровые правила пока не нужны.

