learn.terms.title: "1. Из чего состоит выражение"
learn.terms.body: |
  В выражении 3x + 5 два слагаемых: 3x и 5.

  В выражении 4x − 2 + 7y слагаемые удобно читать вместе со знаками: 4x, −2 и +7y. Знак относится к следующему за ним слагаемому. Поэтому x − 3 можно понимать как x + (−3).

  Буква x — переменная, отдельное число — постоянное слагаемое. Новые слова будем вводить постепенно.

learn.groups.title: "2. Скобки — это пакет"
learn.groups.body: |
  Скобки объединяют несколько слагаемых в один объект. В 7 + (x − 3) группа внутри скобок — x − 3.

  Внешнее действие относится ко всему пакету, а не только к его первой части. Именно поэтому важно сначала увидеть границы группы и посчитать слагаемые внутри.

learn.plus.title: "3. Плюс перед скобками"
learn.plus.body: |
  Прибавить группу означает сохранить её без изменений:

  +(x + 3) = x + 3
  +(x − 3) = x − 3

  Поэтому 5 + (x − 2) = 5 + x − 2. Плюс перед скобками ничего не меняет внутри.

learn.minus.title: "4. Минус перед скобками"
learn.minus.body: |
  Минус перед группой означает умножение всей группы на −1.

  −(x + 4) = −x − 4
  −(x − 4) = −x + 4

  Во втором примере (−1)·(−4) = +4. Правило «поменять знаки» — лишь короткая запись распределения множителя −1 по всем слагаемым.

learn.numeric.title: "5. Распределение на числах"
learn.numeric.body: |
  3(4 + 2) — это три копии всего пакета (4 + 2).

  3(4 + 2) = 3·4 + 3·2 = 12 + 6 = 18.

  Оба числа умножаются на 3, потому что множитель относится ко всей группе. Это и есть распределительный закон.

learn.positive.title: "6. Положительный множитель"
learn.positive.body: |
  Число перед скобками умножает каждое слагаемое внутри:

  2(x + 3) = 2x + 6
  4(x − 2) = 4x − 8
  3(2x + 5) = 6x + 15

  Проверяй два шага: сначала множитель на первое слагаемое, затем на второе.

learn.negative.title: "7. Отрицательный множитель"
learn.negative.body: |
  Отрицательный множитель тоже действует на каждое слагаемое:

  −2(x + 3) = −2x − 6
  −2(x − 3) = −2x + 6
  −3(2x − 4) = −6x + 12

  Минус перед скобками — частный случай с множителем −1.

learn.like.title: "8. Подобные слагаемые"
learn.like.body: |
  3 яблока + 2 яблока = 5 яблок. Так же 3x + 2x = 5x.

  Подобные слагаемые имеют одинаковую буквенную часть: 3x и −5x подобны; 3 и 8 тоже подобны как постоянные. Но x и y, x и x², 3x и 2 — не подобны.

  Неподобные слагаемые нельзя превращать в одно: 3x + 2y не равно 5xy.

learn.coefficients.title: "9. Коэффициенты"
learn.coefficients.body: |
  В записи 5x число 5 называется коэффициентом: 5x = 5·x.

  5x + 2x = (5 + 2)x = 7x.

  Значит, приведение подобных слагаемых — это распределительный закон в обратную сторону. Коэффициент у x равен 1, а у −x равен −1.

learn.collect.title: "10. Приводим подобные"
learn.collect.body: |
  Сначала сгруппируй одинаковые виды слагаемых:

  3x + 2 + 4x + 5
  = 3x + 4x + 2 + 5
  = 7x + 7.

  В 3x + 5 + 2x − 7 + x отдельно собираем x-слагаемые и числа. Получаем 6x − 2.

learn.two_variables.title: "11. Две переменные"
learn.two_variables.body: |
  В выражении 3x + 2y + 4x − y отдельно объединяем x-слагаемые и y-слагаемые:

  (3x + 4x) + (2y − y) = 7x + y.

  Буквенные части x и y различаются, поэтому смешивать их в одно слагаемое нельзя.

learn.expand_collect.title: "12. Раскрыть, затем собрать"
learn.expand_collect.body: |
  В 2(x + 3) + x сначала раскрываем скобки:

  2x + 6 + x.

  Затем приводим подобные:

  3x + 6.

  Ответ 2x + 6 + x правильно раскрыт, но ещё не полностью упрощён.

learn.subtract.title: "13. Вычитаем целую группу"
learn.subtract.body: |
  Внешний минус действует на все слагаемые второй группы:

  3x − (x + 4) = 3x − x − 4 = 2x − 4
  3x − (x − 4) = 3x − x + 4 = 2x + 4.

  Ошибка 3x − (x − 4) → 3x − x − 4 возникает, если забыть произведение двух минусов.

learn.full.title: "14. Две группы и несколько шагов"
learn.full.body: |
  Пример: 3(2x − 1) − 2(x + 4).

  Раскрываем обе группы:
  6x − 3 − 2x − 8.

  Объединяем x-слагаемые и числа:
  4x − 11.

  Порядок надёжен: увидеть внешние множители → распределить каждый по всей группе → сгруппировать подобные → сложить коэффициенты и числа.

learn.reference.title: "15. Краткая памятка"
learn.reference.body: |
  +(a + b) = a + b
  +(a − b) = a − b
  −(a + b) = −a − b
  −(a − b) = −a + b

  k(a + b) = ka + kb
  k(a − b) = ka − kb

  ax + bx = (a + b)x

  Раскрытие скобок, минус перед скобками и приведение подобных — разные направления одного распределительного закона, а не набор несвязанных трюков.

